apiVersion: v1
kind: Service
metadata:
  name: flint-v7x-8-svc
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: flint-v7x-8-sweep
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flint-v7x-8-sweep
  namespace: default
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: flint-v7x-8-sweep
      annotations:
        gke-gcsfuse/volumes: "true"
        autoscaling.gke.io/provisioning-request: "tpu-v7x-8-usc1-pr"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: default
      subdomain: flint-v7x-8-svc
      restartPolicy: OnFailure
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v7x-8-pool
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x2
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-queued"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: trainer
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/torchtpu/torchtitan-flint:v0.2.0
        imagePullPolicy: Always
        command: ["python3", "/scripts/run_flint_sweep.py"]
        args:
        - --chip-type=v7x
        - --nnodes=2
        - --nproc-per-node=8
        - --master-addr=flint-v7x-8-sweep-0.flint-v7x-8-svc.default.svc.cluster.local
        - --slice-name=v7x-8-2x2x2
        - --hf-model=/models/models/RecursiveSI/flint
        - --steps=15
        - --output-dir=/models/flint-results
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: PJRT_DEVICE
          value: "TPU"
        resources:
          requests:
            google.com/tpu: "4"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: models-gcs
          mountPath: /models
        - name: sweep-script
          mountPath: /scripts
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      - name: models-gcs
        persistentVolumeClaim:
          claimName: tpu-models-gcs-pvc
      - name: sweep-script
        configMap:
          name: flint-sweep-script
