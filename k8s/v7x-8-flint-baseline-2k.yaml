apiVersion: v1
kind: Service
metadata:
  name: flint-v7x-8-baseline-2k-svc
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: flint-v7x-8-baseline-2k
---
# TorchTitan TPU 2K baseline reproduction and step-by-step ablation suite on tpu7x-2x2x2
# (v7x-8, 16 TensorCore ranks, SimpleFSDP-16, global batch 512 x 2048 = 1,048,576 tokens/step).
# See scripts/run_flint_customer_60step_validation.py (--suite=baseline_2k).
apiVersion: batch/v1
kind: Job
metadata:
  name: flint-v7x-8-baseline-2k
  namespace: default
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: flint-v7x-8-baseline-2k
      annotations:
        gke-gcsfuse/volumes: "true"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: default
      subdomain: flint-v7x-8-baseline-2k-svc
      terminationGracePeriodSeconds: 5
      restartPolicy: OnFailure
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v7x-8-pool
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x2
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-queued"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: trainer
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/torchtpu/torchtitan-flint:v0.2.0
        imagePullPolicy: IfNotPresent
        command: ["python3", "/scripts/run_flint_customer_60step_validation.py"]
        args:
        - --suite=baseline_2k
        - --chip-type=v7x
        - --nnodes=2
        - --nproc-per-node=8
        - --master-addr=flint-v7x-8-baseline-2k-0.flint-v7x-8-baseline-2k-svc.default.svc.cluster.local
        - --slice-name=v7x-8-2x2x2
        - --steps=60
        - --output-dir=/models/flint-results
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: PJRT_DEVICE
          value: "TPU"
        resources:
          requests:
            google.com/tpu: "4"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: models-gcs
          mountPath: /models
        - name: val60-script
          mountPath: /scripts
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      - name: models-gcs
        persistentVolumeClaim:
          claimName: tpu-models-gcs-pvc
      - name: val60-script
        configMap:
          name: flint-val60-script
