apiVersion: v1
kind: Service
metadata:
  name: flint-v6e-32-svc
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: flint-v6e-32-sweep
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flint-v6e-32-sweep
  namespace: default
spec:
  completions: 8
  parallelism: 8
  completionMode: Indexed
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: flint-v6e-32-sweep
      annotations:
        gke-gcsfuse/volumes: "true"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: default
      subdomain: flint-v6e-32-svc
      restartPolicy: OnFailure
      nodeSelector:
        cloud.google.com/gke-nodepool: ank-tpu-v6e-32-spot
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 4x8
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: trainer
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/torchtpu/torchtitan-flint:v0.2.0
        imagePullPolicy: Always
        command: ["python3", "/scripts/run_flint_sweep.py"]
        args:
        - --chip-type=v6e
        - --nnodes=8
        - --nproc-per-node=4
        - --master-addr=flint-v6e-32-sweep-0.flint-v6e-32-svc.default.svc.cluster.local
        - --slice-name=v6e-32-4x8
        - --hf-model=/models/models/RecursiveSI/flint
        - --steps=15
        - --output-dir=/models/flint-results
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: PJRT_DEVICE
          value: "TPU"
        resources:
          requests:
            google.com/tpu: "4"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: models-gcs
          mountPath: /models
        - name: sweep-script
          mountPath: /scripts
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      - name: models-gcs
        persistentVolumeClaim:
          claimName: tpu-models-gcs-pvc
      - name: sweep-script
        configMap:
          name: flint-sweep-script
